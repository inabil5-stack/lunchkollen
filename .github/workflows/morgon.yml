# Morgonkörningen: GitHub startar det här automatiskt varje vardagsmorgon.
# Det hämtar menyerna, sparar data/menyer.json och laddar upp den nya filen.
# Hemsidan (GitHub Pages) uppdateras då av sig själv.

name: Hämta dagens luncher

on:
  schedule:
    # GitHub räknar i UTC-tid. 06:20 UTC = 07:20 svensk vintertid (08:20 sommartid).
    # Måndag till fredag (1-5).
    - cron: "20 6 * * 1-5"
  workflow_dispatch:   # gör att du kan starta körningen för hand med en knapp på GitHub

env:
  PYTHONUNBUFFERED: "1"   # visa loggraderna direkt, inte först i slutet

permissions:
  contents: write      # behövs för att få spara den nya menyfilen

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # stoppa körningen om något hänger sig
    steps:
      - name: Hämta projektets filer
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera paket
        run: pip install -r scripts/requirements.txt

      - name: Hämta och tolka menyerna
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/hamta_menyer.py

      - name: Spara den nya menyfilen
        run: |
          git config user.name "lunchkollen-bot"
          git config user.email "lunchkollen-bot@users.noreply.github.com"
          git add data/menyer.json
          git diff --staged --quiet || git commit -m "Dagens luncher $(date +%F)"
          git pull --rebase
          git push
